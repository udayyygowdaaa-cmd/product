<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packages & Cab Rentals – LV Tour & Travels</title>
<style>
:root{--b:#7b4a2a;--bd:#5a3419;--g:#e0a64b;--c:#f6eee8;--l:#eadfd6;--m:#7a6a5f;--i:#2b1d14}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:var(--i);background:#fffdfb;line-height:1.6}
h1,h2,h3{font-family:Georgia,serif;line-height:1.2}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
header.site{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--l);z-index:20}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--b)}
.logo span{width:42px;height:42px;background:var(--b);color:#fff;border-radius:10px;display:grid;place-items:center;font-family:Georgia,serif}
nav a{margin-left:18px;color:var(--m);font-weight:500}
nav a:hover,nav a.on{color:var(--b)}
.cb{margin-left:18px;background:var(--b);color:#fff;border:0;padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600}
.btn{display:inline-block;background:var(--b);color:#fff;border:0;padding:12px 24px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:var(--bd)}
.btn.gold{background:var(--g);color:#3b2410}
.btn.wa{background:#1f9d55}
.btn.line{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.btn.sm{padding:8px 16px;font-size:.9rem}
section{padding:50px 0}
.alt{background:var(--c)}
.sh{text-align:center;margin-bottom:30px}
.sh h2{font-size:2rem}
.sh p{color:var(--m)}
.page-h{background:var(--c);padding:44px 0;text-align:center}
.page-h h1{font-size:2.2rem}
.page-h p{color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(91,52,25,.12);display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-5px)}
.ph{height:180px;display:grid;place-items:center;font-size:4.5rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card .b{padding:16px;display:flex;flex-direction:column;gap:5px;flex:1}
.cat{font-size:.72rem;color:var(--m);text-transform:uppercase;letter-spacing:.08em}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:800;color:var(--b)}
.price small{font-weight:400;color:var(--m)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--l);background:#fff;padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:.9rem}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
input,select,textarea{padding:12px 14px;border:1.5px solid var(--l);border-radius:12px;font:inherit;width:100%;background:#fff}
.tools input{flex:1;min-width:200px;width:auto}
.tools select{width:auto}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.detail .ph{height:380px;border-radius:24px;font-size:9rem}
.detail h1{font-size:2.1rem;margin:6px 0}
.detail .price{font-size:1.7rem;margin:8px 0 12px}
.detail ul{list-style:none;margin:14px 0;display:grid;gap:8px}
.detail li:before{content:"✓";color:#fff;background:var(--b);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:.7rem;margin-right:10px}
.qty{display:flex;align-items:center;gap:12px;margin:8px 0}
.detail .qty{margin:18px 0}
.qty button{width:34px;height:34px;border:1.5px solid var(--l);background:#fff;border-radius:50%;cursor:pointer}
footer{background:#241810;color:#cdbfb4;padding:34px 0;margin-top:30px;font-size:.9rem;text-align:center}
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:#1f9d55;color:#fff;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
#dr{position:fixed;top:0;right:-430px;width:400px;max-width:100%;height:100%;background:#fff;z-index:40;transition:right .28s;display:flex;flex-direction:column}
#dr.open{right:0}
.dh{padding:18px 22px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;font-weight:700;font-family:Georgia,serif}
.dh button{border:0;background:none;font-size:1.5rem;cursor:pointer}
#items{flex:1;overflow:auto;padding:16px 22px}
.ci{display:flex;gap:12px;margin-bottom:16px;align-items:center}
.ci .t{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:1.8rem;flex:none;overflow:hidden}
.ci .i{flex:1;font-size:.92rem}
.ci .rm{border:0;background:none;color:#b91c1c;cursor:pointer;font-size:.8rem}
#foot{padding:16px 22px;border-top:1px solid var(--l);display:flex;flex-direction:column;gap:9px;background:var(--c)}
#foot .tt{display:flex;justify-content:space-between;font-weight:700}
@media(max-width:820px){.detail{grid-template-columns:1fr}.detail .ph{height:240px}nav a{margin-left:10px;font-size:.9rem}}
</style>
</head>
<body>

<main id="main"></main>

<script>
/* ===== EDIT YOUR DETAILS & PACKAGES HERE ===== */
const STORE="LV Tour & Travels", PHONE="8073080995", WA="918073080995";
const PACKAGES=[
 {id:1,name:"Mysore Palace & Chamundi Hills",cat:"Tour Packages",dur:"1 Day",price:1499,unit:"person",emoji:"🏰",bg:"#fbe2a6,#f4a97a",desc:"A full-day Mysore sightseeing tour from Bangalore with comfortable AC transport.",inc:["Mysore Palace","Chamundi Hill & Nandi Bull","Brindavan Gardens","Pickup & drop"]},
 {id:2,name:"Coorg Weekend Getaway",cat:"Tour Packages",dur:"2 Days / 1 Night",price:4999,unit:"person",emoji:"☕",bg:"#cfe8d5,#8fc0a0",desc:"Misty hills, coffee estates and waterfalls in the Scotland of India.",inc:["Abbey Falls","Raja's Seat","Dubare Elephant Camp","Stay & transport"]},
 {id:3,name:"Ooty & Coonoor Escape",cat:"Tour Packages",dur:"3 Days / 2 Nights",price:7499,unit:"person",emoji:"🌿",bg:"#bfe3f5,#9ad0b5",desc:"Tea gardens, botanical garden and Ooty lake in the Nilgiris.",inc:["Botanical Garden","Doddabetta Peak","Tea factory visit","Hotel stay"]},
 {id:4,name:"Hampi Heritage Tour",cat:"Tour Packages",dur:"2 Days / 1 Night",price:5499,unit:"person",emoji:"🛕",bg:"#f7c58a,#e98a5c",desc:"Explore the UNESCO World Heritage ruins of the Vijayanagara empire.",inc:["Virupaksha Temple","Vittala Temple","Lotus Mahal","Stay & guide"]},
 {id:5,name:"Munnar & Wayanad Holiday",cat:"Tour Packages",dur:"4 Days / 3 Nights",price:11999,unit:"person",emoji:"🌴",bg:"#c9e8c0,#7fb98a",desc:"Green hills, spice plantations and waterfalls across Kerala.",inc:["Tea plantations","Eravikulam National Park","Edakkal Caves","Hotel & transport"]},
 {id:6,name:"Swift Dzire (Sedan)",cat:"Cab Rentals",dur:"Per day · 8hr/80km",price:2200,unit:"day",emoji:"🚗",bg:"#d7ecf7,#a9cfe6",desc:"Comfortable 4-seater sedan for local sightseeing and outstation travel.",inc:["4 passengers","Air conditioned","Professional driver"]},
 {id:7,name:"Toyota Innova",cat:"Cab Rentals",dur:"Per day · 8hr/80km",price:3500,unit:"day",emoji:"🚙",bg:"#e4dcf3,#bba9dd",desc:"Spacious 6–7 seater, perfect for family trips.",inc:["6–7 passengers","Air conditioned","Professional driver"]},
 {id:8,name:"Tempo Traveller",cat:"Cab Rentals",dur:"Per day · 8hr/80km",price:5500,unit:"day",emoji:"🚐",bg:"#ffe3c2,#f3b97a",desc:"12–17 seater for groups, corporate outings and weddings.",inc:["12–17 passengers","Air conditioned","Extra luggage space"]},
 {id:9,name:"Airport Transfer (Bangalore)",cat:"Cab Rentals",dur:"One way",price:1200,unit:"trip",emoji:"✈️",bg:"#bfe0f7,#7fb6e6",desc:"Reliable pickup and drop to Kempegowda International Airport.",inc:["On-time pickup","Flight tracking","Sedan / SUV options"]}
];
/* To use a real photo, add  photo:"images/coorg.jpg"  to a package */

const money=n=>"₹"+n.toLocaleString("en-IN");
const ph=p=>`<div class="ph" style="background:linear-gradient(160deg,${p.bg})">${p.photo?`<img src="${p.photo}" alt="${p.name}">`:p.emoji}</div>`;

/* ===== BOOKING CART (saved in browser) ===== */
const getCart=()=>JSON.parse(localStorage.getItem("lvcart")||"[]");
const saveCart=c=>{localStorage.setItem("lvcart",JSON.stringify(c));renderCart();};
function addToCart(id,q=1){const c=getCart(),i=c.find(x=>x.id===id);i?i.qty+=q:c.push({id,qty:q});saveCart(c);openCart();}
function changeQty(id,d){let c=getCart();const i=c.find(x=>x.id===id);if(i){i.qty+=d;if(i.qty<1)c=c.filter(x=>x.id!==id);}saveCart(c);}
function removeItem(id){saveCart(getCart().filter(x=>x.id!==id));}
function openCart(){dr.classList.add("open");ov.style.display="block";}
function closeCart(){dr.classList.remove("open");ov.style.display="none";}
function renderCart(){
  let total=0,count=0;
  const html=getCart().map(x=>{
    const p=PACKAGES.find(p=>p.id===x.id);if(!p)return"";
    total+=p.price*x.qty;count+=x.qty;
    return `<div class="ci"><div class="t" style="background:linear-gradient(160deg,${p.bg})">${p.emoji}</div>
      <div class="i"><b>${p.name}</b><br>${money(p.price)} / ${p.unit}
      <div class="qty"><button onclick="changeQty(${p.id},-1)">−</button>${x.qty}<button onclick="changeQty(${p.id},1)">+</button></div></div>
      <button class="rm" onclick="removeItem(${p.id})">Remove</button></div>`;
  }).join("");
  items.innerHTML=html||'<p style="color:#7a6a5f;text-align:center;margin-top:40px">🧳<br>No bookings added yet.</p>';
  total_.textContent=money(total);cnt.textContent=count;
}
function checkout(){
  const c=getCart();
  if(!c.length)return alert("Please add a package or vehicle first.");
  const n=bn.value.trim(),p=bp.value.trim(),d=bd.value;
  if(!n||!p||!d)return alert("Please enter your name, phone and travel date.");
  let total=0;
  const lines=c.map(x=>{const k=PACKAGES.find(k=>k.id===x.id);total+=k.price*x.qty;return `• ${k.name} (${k.dur}) × ${x.qty} = ${money(k.price*x.qty)}`;});
  const msg=`*New Booking – ${STORE}*\nName: ${n}\nPhone: ${p}\nTravel date: ${d}\n\n${lines.join("\n")}\n\n*Estimated total: ${money(total)}*`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank");
  saveCart([]);closeCart();
}
function card(p){
  return `<div class="card"><a href="product.html?id=${p.id}">${ph(p)}</a>
  <div class="b"><span class="cat">${p.cat} · ${p.dur}</span><a href="product.html?id=${p.id}"><h3>${p.name}</h3></a>
  <div class="row"><span class="price">${money(p.price)} <small>/ ${p.unit}</small></span><button class="btn sm" onclick="addToCart(${p.id})">Book</button></div></div></div>`;
}

/* ===== HEADER / FOOTER / CART DRAWER ===== */
const page=location.pathname.split("/").pop()||"index.html";
const on=h=>page===h?"on":"";
document.body.insertAdjacentHTML("afterbegin",`
<header class="site"><div class="wrap"><a class="logo" href="index.html"><span>LV</span>Tour &amp; Travels</a>
 <nav><a class="${on("index.html")}" href="index.html">Home</a><a class="${on("product.html")}" href="product.html">Packages</a><a class="${on("contact.html")}" href="contact.html">Contact</a>
 <button class="cb" onclick="openCart()">🧳 <span id="cnt">0</span></button></nav></div></header>
<div id="ov" onclick="closeCart()"></div>
<aside id="dr"><div class="dh">Your Booking <button onclick="closeCart()">×</button></div><div id="items"></div>
 <div id="foot"><div class="tt"><span>Estimated total</span><span id="total_">₹0</span></div>
 <input id="bn" placeholder="Your name"><input id="bp" type="tel" placeholder="Phone number"><input id="bd" type="date">
 <button class="btn wa" onclick="checkout()">Confirm on WhatsApp</button></div></aside>`);
document.body.insertAdjacentHTML("beforeend",`<footer><div class="wrap">© ${new Date().getFullYear()} ${STORE} · Bangalore &amp; Mysore · 📞 ${PHONE} · Instagram @Lvtour&amp;travels</div></footer>
<a class="fab" href="https://wa.me/${WA}" target="_blank">💬</a>`);
bd.min=new Date().toISOString().split("T")[0];
renderCart();

/* ===== PAGE: PACKAGES (list + detail) ===== */
let cat="";
const pid=+new URLSearchParams(location.search).get("id");
const pk=PACKAGES.find(x=>x.id===pid);
pid&&pk?showDetail(pk):showList();

function showList(){
  const cats=["All",...new Set(PACKAGES.map(p=>p.cat))];
  main.innerHTML=`<div class="page-h"><div class="wrap"><h1>Tour Packages &amp; Cab Rentals</h1><p>Choose your trip, add it to your booking and confirm on WhatsApp.</p></div></div>
  <section><div class="wrap">
    <div class="chips">${cats.map(c=>`<button class="chip ${c==="All"?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
    <div class="tools"><input id="q" placeholder="Search destination or vehicle..."><select id="sort"><option value="">Sort by</option><option value="lo">Price: Low to High</option><option value="hi">Price: High to Low</option></select></div>
    <div class="grid" id="list"></div></div></section>`;
  const draw=()=>{
    const q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("sort").value;
    let r=PACKAGES.filter(p=>p.name.toLowerCase().includes(q)&&(!cat||p.cat===cat));
    if(s==="lo")r.sort((a,b)=>a.price-b.price);
    if(s==="hi")r.sort((a,b)=>b.price-a.price);
    document.getElementById("list").innerHTML=r.map(card).join("")||"<p>Nothing found. Try another search.</p>";
  };
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    cat=b.dataset.c==="All"?"":b.dataset.c;
    document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));draw();
  });
  ["q","sort"].forEach(i=>document.getElementById(i).addEventListener("input",draw));
  draw();
}
function showDetail(p){
  document.title=p.name+" – LV Tour & Travels";
  const label=p.unit==="person"?"Travellers":p.unit==="day"?"Days":"Trips";
  main.innerHTML=`<section><div class="wrap">
    <p style="margin-bottom:18px"><a href="product.html" style="color:var(--b);font-weight:600">← Back to all</a></p>
    <div class="detail">${ph(p)}
      <div><span class="cat">${p.cat} · ${p.dur}</span><h1>${p.name}</h1>
        <div class="price">${money(p.price)} <small>/ ${p.unit}</small></div>
        <p style="color:var(--m)">${p.desc}</p>
        <ul>${p.inc.map(i=>`<li>${i}</li>`).join("")}</ul>
        <div class="qty"><span>${label}:</span><button onclick="chg(-1)">−</button><b id="n">1</b><button onclick="chg(1)">+</button></div>
        <button class="btn" onclick="addToCart(${p.id},+document.getElementById('n').textContent)">Add to Booking</button>
        <a class="btn line" href="contact.html" style="margin-left:8px">Ask a question</a>
      </div></div></div></section>
  <section class="alt"><div class="wrap"><div class="sh"><h2>You may also like</h2></div>
  <div class="grid">${PACKAGES.filter(x=>x.id!==p.id).slice(0,4).map(card).join("")}</div></div></section>`;
}
function chg(d){const n=document.getElementById("n");n.textContent=Math.max(1,+n.textContent+d);}
</script>
</body>
</html>
